[project]
name = "stock"
version = "0.1.0"
description = "Point-in-time correct stock analysis, portfolio tracking and signal generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The live chart's client to KIS's real-time feed; uvicorn[standard] brings it,
    # but the feed depends on it directly.
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Below 2.1: 2.1 changed how `select(Model)` is typed, and the repositories
    # are written and tested against 2.0. Lift with that migration, not by drift.
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "exchange-calendars>=4.6",
    "pandas>=2.2",
    "numpy>=2.1",
    "yfinance>=0.2.50",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Claude through the Agent SDK, billed to the owner's Claude subscription. An
# extra, not a dependency: the wheel carries the Claude Code binary (about
# 100 MB), and nothing but `judge-news` and `read-news` needs it.
llm = [
    "claude-agent-sdk>=0.2.158",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "time-machine>=2.16",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-requests",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# =============================================================================
# Ruff — formatter + linter. Black is intentionally not used; ruff format
# covers it and keeps the toolchain to one tool.
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez  <- enforces timezone-aware datetimes
    "SIM",       # simplify
    "TID",       # tidy-imports
    "RUF",
    "BLE",       # blind-except  <- `except Exception` must be deliberate
]
ignore = [
    "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Collectors are the one place a broad catch is allowed: they are the isolation
# boundary for external-world failure. Everything else must use typed excepts.
"app/collectors/base.py" = ["BLE001"]
"app/worker.py" = ["BLE001"]
"app/api/health.py" = ["BLE001"]

# clock.py is the single legitimate caller of datetime.now(); banning it
# everywhere is the point, and this is the implementation being pointed at.
"app/core/clock.py" = ["TID251"]

# Tests must be able to construct the very values the system rejects. A test
# that naive datetimes are refused has to build a naive datetime.
"tests/**" = ["S101", "DTZ001", "DTZ005"]

# Generated by Alembic; formatting is the tool's business, not ours.
"alembic/versions/*" = ["I001", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Naive UTC is banned. Use app.core.clock.utc_now()."
"datetime.datetime.now".msg = "Use app.core.clock.utc_now() so time is patchable in tests."

[tool.ruff.lint.isort]
known-first-party = ["app"]

# =============================================================================
# mypy — strict on the pure domain modules first. Collector/adapter layers get
# tightened later; starting globally strict just means fighting pandas stubs.
# =============================================================================
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.scoring.*",
    "app.engines.*",
    "app.backtest.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*", "apscheduler.*"]
ignore_missing_imports = true

# The `llm` extra, which CI does not install: its wheel carries the Claude Code
# binary. Imported lazily, only where a model is actually called.
[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: needs a live database",
]
# Split by file, not by test. Each integration file seeds an instrument under
# its own CIK, so files are independent — but tests inside one file share that
# CIK and would collide on its unique constraint if they ran together.
#
# `not integration` by default, so a bare `pytest` is the unit suite and runs
# in seconds. The integration tests talk to a live Postgres and walk hundreds
# of simulated sessions each; they are the ones worth having and also the ones
# that make a routine check take a quarter of an hour.
#
#     pytest                  the fast suite, on every change
#     pytest -m integration   the slow half, when it is worth the wait
#     pytest -m ""            everything
#
# CI runs `pytest -m ""`, so nothing is skipped on the way to main — the split
# changes when the slow tests run, not whether they do.
addopts = "-n auto --dist loadfile -m 'not integration'"

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py", "*/__init__.py"]
